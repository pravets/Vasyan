plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Enable Forge JarJar (bundles runtime libraries into the mod jar, META-INF/jarjar)
jarJar.enable()

version = '1.0.0'
group = 'ru.pravets.vasyan'

base {
    archivesName = 'vasyan-ai-mod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                vasyan {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                vasyan {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // HTTP client - Using Java 11+ built-in HttpClient (no external dependencies needed!)
    // JSON parsing - Minecraft already includes Gson
    // LLM cache - JDK LinkedHashMap (no Caffeine needed)
    // SHA-256 hashing - JDK MessageDigest (no commons-codec needed)

    // Resilience4j for fault tolerance (circuit breaker, retry, rate limiting, bulkhead)
    // Bundled into the mod jar via JarJar (META-INF/jarjar) so the mod works outside the dev env.
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.1.0'

    jarJar('io.github.resilience4j:resilience4j-core:2.1.0') { jarJar.ranged(it, '[2.1.0,3.0.0)'); exclude group: 'org.slf4j' }
    jarJar('io.github.resilience4j:resilience4j-circuitbreaker:2.1.0') { jarJar.ranged(it, '[2.1.0,3.0.0)'); exclude group: 'org.slf4j' }
    jarJar('io.github.resilience4j:resilience4j-retry:2.1.0') { jarJar.ranged(it, '[2.1.0,3.0.0)'); exclude group: 'org.slf4j' }
    jarJar('io.github.resilience4j:resilience4j-ratelimiter:2.1.0') { jarJar.ranged(it, '[2.1.0,3.0.0)'); exclude group: 'org.slf4j' }
    jarJar('io.github.resilience4j:resilience4j-bulkhead:2.1.0') { jarJar.ranged(it, '[2.1.0,3.0.0)'); exclude group: 'org.slf4j' }
    jarJar('io.vavr:vavr:0.10.4') { jarJar.ranged(it, '[0.10.4,0.11.0)') }

    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Vasyan AI mod',
            'Specification-Vendor': 'Iosif Pravets',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Iosif Pravets'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

