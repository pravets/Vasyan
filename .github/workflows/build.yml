name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Stage mod jar (JarJar variant as the single deliverable)
        run: |
          VERSION=$(grep -oP "version = '\\K[^']+" build.gradle)
          mkdir -p dist
          cp build/libs/vasyan-ai-mod-${VERSION}-all.jar dist/vasyan-ai-mod-${VERSION}.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vasyan-ai-mod
          path: dist/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: vasyan-ai-mod

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" *.jar --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
