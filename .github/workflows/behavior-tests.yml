name: behavior-tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  behavior:
    name: Behavior tests (headless server)
    runs-on: ubuntu-latest
    # Two server starts (force-load scenario + restart scenario) plus Forge boot
    # time need a generous but bounded timeout.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod jar
        run: ./gradlew build -x test --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Setup headless Forge server
        run: bash scripts/behavior/setup_server.sh /tmp/fgtest

      - name: Install mod into server
        run: |
          cp build/libs/vasyan-ai-mod-1.0.0-all.jar /tmp/fgtest/mods/
          # Minimal LLM config for the headless run: one-member chain (ollama,
          # no key needed). The endpoint is unreachable in CI by design - the
          # pattern-fallback handler produces deterministic tasks.
          mkdir -p /tmp/fgtest/config
          cat > /tmp/fgtest/config/vasyan-common.toml <<'EOF'
          [llm]
          providerChain = ["ollama"]
          EOF

      - name: Run chunk force-load behavior test
        # Runs both the original force-load scenario and the restart scenario
        # (issue #14): a Vasyan teleported far away must keep its chunk
        # force-loaded and continue ticking after a server restart with no
        # players online.
        run: python3 scripts/behavior/behavior_test.py --dir /tmp/fgtest --jar build/libs/vasyan-ai-mod-1.0.0-all.jar

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-server-logs
          path: |
            /tmp/fgtest/behavior.log
            /tmp/fgtest/behavior_restart.log
            /tmp/fgtest/behavior_nav.log
