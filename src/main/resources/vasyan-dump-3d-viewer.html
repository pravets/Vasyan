<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vasyan Dump 3D Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px;
      max-width: 320px; font-size: 13px; line-height: 1.4;
    }
    #dropzone {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85); border: 3px dashed #555;
      transition: opacity .2s; pointer-events: none; opacity: 0;
    }
    #dropzone.active { opacity: 1; }
    #dropzone div { text-align: center; }
    #dropzone h2 { margin: 0 0 8px; }
    canvas { display: block; }
    .key { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; }
    #tooltip {
      position: absolute; pointer-events: none; z-index: 30;
      background: rgba(0,0,0,0.8); padding: 6px 10px; border-radius: 6px;
      font-size: 12px; display: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script id="vasyan-dump-data">window.VASYAN_DUMP = null;</script>
  <div id="info">
    <strong>Vasyan Dump 3D Viewer</strong><br/>
    <span id="filename">—</span><br/><br/>
    <span class="key" style="background:#ff4444"></span>бот<br/>
    <span class="key" style="background:#22cc44"></span>surface blocks<br/>
    <span class="key" style="background:#ffcc00"></span>visible blocks<br/><br/>
    ЛКМ — вращать, ПКМ — перемещать, колесо — зум.
  </div>
  <div id="dropzone"><div><h2>Перетащи JSON dump</h2><p>или передай ?dump=url</p></div></div>
  <div id="tooltip"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(30, 30, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 0.7);
    dir.position.set(50, 100, 50);
    scene.add(dir);

    // Helpers
    const gridHelper = new THREE.GridHelper(64, 64, 0x444444, 0x222222);
    scene.add(gridHelper);

    const tooltip = document.getElementById('tooltip');
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const clickable = [];
    const textureLoader = new THREE.TextureLoader();
    const textureCache = new Map();

    const TEXTURE_BASE = 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/';

    function textureUrl(blockId) {
      const name = blockId.split(':').pop();
      const map = {
        'grass_block': 'grass_block_top',
        'oak_log': 'oak_log',
        'spruce_log': 'spruce_log',
        'birch_log': 'birch_log',
        'jungle_log': 'jungle_log',
        'acacia_log': 'acacia_log',
        'dark_oak_log': 'dark_oak_log',
        'oak_leaves': 'oak_leaves',
        'spruce_leaves': 'spruce_leaves',
        'birch_leaves': 'birch_leaves',
        'sugar_cane': 'sugar_cane',
        'tall_grass': 'tall_grass',
        'grass': 'grass',
        'water': 'water_still',
        'sand': 'sand',
        'dirt': 'dirt',
        'stone': 'stone',
        'cobblestone': 'cobblestone',
        'deepslate': 'deepslate',
        'gravel': 'gravel',
        'coal_ore': 'coal_ore',
        'iron_ore': 'iron_ore',
        'copper_ore': 'copper_ore',
        'gold_ore': 'gold_ore',
        'redstone_ore': 'redstone_ore',
        'lapis_ore': 'lapis_ore',
        'diamond_ore': 'diamond_ore',
        'emerald_ore': 'emerald_ore',
        'bedrock': 'bedrock'
      };
      return TEXTURE_BASE + (map[name] || name) + '.png';
    }

    function getMaterial(blockId) {
      if (textureCache.has(blockId)) {
        return textureCache.get(blockId);
      }
      const fallbackColor = hashColor(blockId);
      const name = blockId.split(':').pop();
      const isWater = name === 'water';
      const baseColor = isWater ? 0x44aaff : fallbackColor;
      const material = new THREE.MeshLambertMaterial({
        color: baseColor,
        transparent: isWater,
        opacity: isWater ? 0.6 : 1.0,
        side: isWater ? THREE.DoubleSide : THREE.FrontSide
      });
      textureCache.set(blockId, material);
      textureLoader.load(textureUrl(blockId),
        tex => { material.color.setHex(0xffffff); material.map = tex; material.needsUpdate = true; },
        undefined,
        () => { /* fallback color stays */ }
      );
      return material;
    }

    function hashColor(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
      const c = (h & 0x00ffffff).toString(16).padStart(6, '0');
      return parseInt(c, 16);
    }

    function clearSceneObjects() {
      for (const obj of clickable) scene.remove(obj);
      clickable.length = 0;
    }

    function loadDump(data, filename) {
      document.getElementById('filename').textContent = filename || 'dump';
      clearSceneObjects();

      const vision = data.vision || {};
      const botX = (data.meta && data.meta.x) || 0;
      const botY = (data.meta && data.meta.y) || 0;
      const botZ = (data.meta && data.meta.z) || 0;

      // Center scene on bot
      controls.target.set(botX, botY, botZ);
      camera.position.set(botX + 30, botY + 30, botZ + 30);

      // Bot marker
      const botGeo = new THREE.SphereGeometry(0.5, 16, 16);
      const botMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });
      const bot = new THREE.Mesh(botGeo, botMat);
      bot.position.set(botX + 0.5, botY + 0.5, botZ + 0.5);
      bot.userData = { tooltip: `Vasyan ${data.meta && data.meta.name || ''} (${botX}, ${botY}, ${botZ})` };
      scene.add(bot);
      clickable.push(bot);

      // Surface blocks
      for (const b of vision.surfaceBlocks || []) {
        const geo = new THREE.BoxGeometry(0.98, 0.98, 0.98);
        const mat = getMaterial(b.id);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(b.x + 0.5, b.y + 0.5, b.z + 0.5);
        mesh.userData = { tooltip: `${b.id}\n(${b.x}, ${b.y}, ${b.z})` };
        scene.add(mesh);
        clickable.push(mesh);
      }

      // Visible blocks
      if (vision.visibleSummary) {
        const entries = vision.visibleSummary.matchAll(/([\w:]+)\s+x(\d+)\s+\((\d+)m\s+([NSEW]+)\)/g);
        for (const m of entries) {
          const id = m[1]; const count = parseInt(m[2]); const dist = parseInt(m[3]); const dir = m[4];
          // approximate position using direction/distance
          const ang = dir.split('').reduce((a, c) => a + ({N:0,NE:-45,E:-90,SE:-135,S:180,SW:135,W:90,NW:45}[c]||0)/dir.length, 0) * Math.PI/180;
          const vx = Math.round(botX - Math.sin(ang) * dist);
          const vz = Math.round(botZ - Math.cos(ang) * dist);
          const geo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
          const mat = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(vx + 0.5, botY + 0.5, vz + 0.5);
          mesh.userData = { tooltip: `${id} x${count}\n~${dist}m ${dir}` };
          scene.add(mesh);
          clickable.push(mesh);
        }
      }

      // Ground plane at bot Y
      const planeGeo = new THREE.PlaneGeometry(128, 128);
      const planeMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
      const plane = new THREE.Mesh(planeGeo, planeMat);
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(botX, botY - 0.01, botZ);
      scene.add(plane);
    }

    async function fetchDump(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(resp.statusText);
      return resp.json();
    }

    // Embedded dump injected by VasyanDumpWriter
    if (window.VASYAN_DUMP) {
      loadDump(window.VASYAN_DUMP, 'dump');
    }

    // URL param ?dump=...
    const params = new URLSearchParams(window.location.search);
    const dumpUrl = params.get('dump');
    if (dumpUrl && !window.VASYAN_DUMP) {
      fetchDump(dumpUrl).then(d => loadDump(d, dumpUrl)).catch(e => alert('Ошибка загрузки dump: ' + e));
    }

    // Drag & drop
    const dz = document.getElementById('dropzone');
    window.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('active'); });
    window.addEventListener('dragleave', e => { if (e.relatedTarget === null) dz.classList.remove('active'); });
    window.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('active');
      const file = e.dataTransfer.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const json = JSON.parse(ev.target.result);
          loadDump(json, file.name);
        } catch (err) { alert('Невалидный JSON: ' + err); }
      };
      reader.readAsText(file);
    });

    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickable, false);
      if (hits.length > 0 && hits[0].object.userData.tooltip) {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY + 12) + 'px';
        tooltip.textContent = hits[0].object.userData.tooltip;
      } else {
        tooltip.style.display = 'none';
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
